services:
  db:
    image: postgres:17-alpine
    container_name: kbo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kbo
      POSTGRES_PASSWORD: kbo
      POSTGRES_DB: kbo
    ports:
      - "5433:5432"
    volumes:
      - kbo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbo -d kbo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kbo-data:
